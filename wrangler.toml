# Cloudflare config. The project was created as a Worker with static assets
# (Workers & Pages -> Connect to Git). Cloudflare runs `npm run build`, then
# `npx wrangler deploy`, which uploads the built site in ./dist.
name = "gatsby-site1"  # must match the Worker name in the Cloudflare dashboard
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
